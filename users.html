<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f1f3f5;
        }
        .container {
            margin-top: 50px;
        }
        table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        table th {
            background-color: #6c5ce7;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn btn-secondary mb-3">← Back to Dashboard</a>
    <h2 class="mb-4">List of Registered Users</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Email</th>
                <th>Password</th>
            </tr>
        </thead>
        <tbody id="userList">
            <!-- Users will appear here -->
        </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const userList = document.getElementById('userList');

        if (users.length === 0) {
            userList.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No users found</td></tr>';
        } else {
            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${user.name}</td><td>${user.email}</td><td>•••••••</td>`;
                userList.appendChild(tr);
            });
        }
    });
</script>

</body>
</html>
